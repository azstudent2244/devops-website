name: Website Conainers CI/CD
on:
  push:
    branches:
      - main

concurrency:
  group: website-delivery
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  NAME_SUFFIX: 'jsm01'
  RESOURCE_GROUP: 'rg-devops-site'
  IMAGE_NAME: 'devops-website'
  TF_VERSION: '1.15.8'

jobs:
  ci:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Validate site files and Dockerfile
        run: |
          echo "Validating"
          test -f site/index.html || (echo "Missing index.html" && exit 1)
          test -f site/styles.css || (echo "Missing styles.css" && exit 1)
          test -f Dockerfile || (echo "Missing Dockerfile" && exit 1)
          echo "All required files found."

  provision:
    name: Provision Azure infrastructure
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install Terraform 
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Terraform init, plan, apply
        working-directory: infra
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_name_suffix: ${{ env.NAME_SUFFIX }}
        run: |
          terraform init
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan

        