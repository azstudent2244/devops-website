name: Website Conainers CI/CD
on:
  push:
    branches:
      - main

concurrency:
  group: website-delivery
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  NAME_SUFFIX: 'jsm01'
  RESOURCE_GROUP: 'rg-devops-site'
  IMAGE_NAME: 'devops-website'
  TF_VERSION: '1.15.8'

jobs:
  ci:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Validate site files and Dockerfile
        run: |
          echo "Validating"
          test -f site/index.html || (echo "Missing index.html" && exit 1)
          test -f site/styles.css || (echo "Missing styles.css" && exit 1)
          test -f Dockerfile || (echo "Missing Dockerfile" && exit 1)
          echo "All required files found."

  provision:
    name: Provision Azure infrastructure
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install Terraform 
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Terraform init, plan, apply
        working-directory: infra
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_name_suffix: ${{ env.NAME_SUFFIX }}
        run: |
          terraform init
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan
  build:
    name: Build and push the container image
    needs: provision
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with: 
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push the image
        run: |
          ACR_NAME=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].name" -o tsv)
          ACR_SERVER=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].loginServer" -o tsv)
          ACR_USER=$(az acr credential show --name "$ACR_NAME" --query username -o tsv)
          ACR_PASS=$(az acr credential show --name "$ACR_NAME" --query "passwords[0].value" -o tsv)
          echo "::add-mask::$ACR_PASS"
          echo "$ACR_PASS" | docker login "$ACR_SERVER" --username "$ACR_USER" --password-stdin
          docker build --build-arg GIT_SHA="$GITHUB_SHA" --tag "$ACR_SERVER/$IMAGE_NAME:$GITHUB_SHA" .
          docker push "$ACR_SERVER/$IMAGE_NAME:$GITHUB_SHA"

  deploy-dev:
    name: Deploy to Dev
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy the image to the dev container app
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          ACR_SERVER=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].loginServer" -o tsv)
          az containerapp update --resource-group "$RESOURCE_GROUP" --name "ca-devops-dev-$NAME_SUFFIX" --image "$ACR_SERVER/$IMAGE_NAME:$GITHUB_SHA"
      - name: Smoke test (dev)
        run: |
          FQDN=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "ca-devops-dev-$NAME_SUFFIX" --query properties.configuration.ingress.fqdn -o tsv)
          echo "Checking https://$FQDN/version.txt for $GITHUB_SHA"
          for i in $(seq 1 18); do
            BODY=$(curl --fail --silent "https://$FQDN/version.txt" || true)
            if [ "$BODY" = "$GITHUB_SHA" ]; then
              echo "New version is live: $GITHUB_SHA" 
              echo "Site: https://$FQDN/ (commit $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
              echo "Attempt $i: not live yet, waiting 10 seconds"
              sleep 10
              done
              echo "The new version did not come up in time"
              exit 1

  deploy-test:
    name: Deploy to test
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy the image to the test container app
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          ACR_SERVER=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].loginServer" -o tsv)
          az containerapp update --resource-group "$RESOURCE_GROUP" --name "ca-devops-test-$NAME_SUFFIX" --image "$ACR_SERVER/$IMAGE_NAME:$GITHUB_SHA"
      - name: Smoke test (test)
        run: |
          FQDN=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "ca-devops-test-$NAME_SUFFIX" --query properties.configuration.ingress.fqdn -o tsv)
          echo "Checking https://$FQDN/version.txt for $GITHUB_SHA"
          for i in $(seq 1 18); do
            BODY=$(curl --fail --silent "https://$FQDN/version.txt" || true)
            if [ "$BODY" = "$GITHUB_SHA" ]; then
              echo "New version is live: $GITHUB_SHA" 
              echo "Site: https://$FQDN/ (commit $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
              echo "Attempt $i: not live yet, waiting 10 seconds"
              sleep 10
              done
              echo "The new version did not come up in time"
              exit 1

  deploy-prod:
    name: Deploy to prod
    needs: deploy-test
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy the image to the prod container app
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          ACR_SERVER=$(az acr list --resource-group "$RESOURCE_GROUP" --query "[0].loginServer" -o tsv)
          az containerapp update --resource-group "$RESOURCE_GROUP" --name "ca-devops-prod-$NAME_SUFFIX" --image "$ACR_SERVER/$IMAGE_NAME:$GITHUB_SHA"
      - name: Smoke test (prod)
        run: |
          FQDN=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "ca-devops-prod-$NAME_SUFFIX" --query properties.configuration.ingress.fqdn -o tsv)
          echo "Checking https://$FQDN/version.txt for $GITHUB_SHA"
          for i in $(seq 1 18); do
            BODY=$(curl --fail --silent "https://$FQDN/version.txt" || true)
            if [ "$BODY" = "$GITHUB_SHA" ]; then
              echo "New version is live: $GITHUB_SHA" 
              echo "Site: https://$FQDN/ (commit $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
              echo "Attempt $i: not live yet, waiting 10 seconds"
              sleep 10
              done
              echo "The new version did not come up in time"
              exit 1