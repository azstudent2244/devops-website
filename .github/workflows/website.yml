name: Website CI/CD
on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  NAME_SUFFIX: 'jsm01'
  RESOURCE_GROUP: 'rg-devops-site'
  TF_VERSION: '1.15.8'

jobs:
      ci:
        name: Build and validate
        runs-on: ubuntu-latest
        steps:
          - name: Check out the repository
            uses: actions/checkout@v4
          - name: Validate site files
            run: |                                                 
                 echo "Validating site files..."                      
                 test -f site/index.html || (echo "Missing index.html" && exit 1) 
                 test -f site/styles.css || (echo "Missing styles.css" && exit 1) 
                 echo "All required files found."  
          - name: Zip the website
            run: cd site && zip -r ../site.zip .
          - name: Publish website artifact
            uses: actions/upload-artifact@v4
            with:
              name: website
              path: site.zip

      provision:                                                     
          name: Provision Azure infrastructure                        
          needs: ci                                                   
          runs-on: ubuntu-latest                                        
          steps:                                                     
            - name: Check out the repository                         
              uses: actions/checkout@v4                                
            - name: Log in to Azure (OIDC)                             
              uses: azure/login@v2                                     
              with:                                                    
                client-id: ${{ secrets.AZURE_CLIENT_ID }}              
                tenant-id: ${{ secrets.AZURE_TENANT_ID }}              
                subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }} 
            - name: Install Terraform                                  
              uses: hashicorp/setup-terraform@v3                       
              with:                                                    
                terraform_version: ${{ env.TF_VERSION }}                
                terraform_wrapper: false                               
            - name: Terraform init, plan, apply                        
              working-directory: infra                                
              env:                                                     
                ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }} 
                TF_VAR_name_suffix: ${{ env.NAME_SUFFIX }}              
              run: |                                                   
                terraform init                                          
                terraform plan -out=tfplan                           
                terraform apply -auto-approve tfplan


      deploy-dev:                                                    
           name: Deploy to dev                                         
           needs: provision                                             
           runs-on: ubuntu-latest                                     
           environment: dev                                              
           steps:                                                        
            - name: Download the website artifact                      
              uses: actions/download-artifact@v4                       
              with:                                                    
                name: website                                          
            - name: Log in to Azure (OIDC)                             
              uses: azure/login@v2                                     
              with:                                                     
                client-id: ${{ secrets.AZURE_CLIENT_ID }}               
                tenant-id: ${{ secrets.AZURE_TENANT_ID }}              
                subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}   
            - name: Zip deploy to the dev web app                       
              run: |                                                   
                az webapp deploy --resource-group "$RESOURCE_GROUP" --name "app-devops-dev-$NAME_SUFFIX" --src-path site.zip --type zip  
            - name: Smoke test (dev)                                    
              run: |                                                   
                HOST=$(az webapp show --resource-group "$RESOURCE_GROUP" --name "app-devops-dev-$NAME_SUFFIX" --query defaultHostName -o tsv)  
                echo "Checking https://$HOST/"                          
                curl --fail --silent --show-error --retry 6 --retry-delay 10 "https://$HOST/" | grep -i "hello devops" 

      deploy-test:                                                    
           name: Deploy to test                                         
           needs: deploy-dev                                             
           runs-on: ubuntu-latest                                     
           environment: test                                              
           steps:                                                        
            - name: Download the website artifact                      
              uses: actions/download-artifact@v4                       
              with:                                                    
                name: website                                          
            - name: Log in to Azure (OIDC)                             
              uses: azure/login@v2                                     
              with:                                                     
                client-id: ${{ secrets.AZURE_CLIENT_ID }}               
                tenant-id: ${{ secrets.AZURE_TENANT_ID }}              
                subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}   
            - name: Zip deploy to the test web app                       
              run: |                                                   
                az webapp deploy --resource-group "$RESOURCE_GROUP" --name "app-devops-test-$NAME_SUFFIX" --src-path site.zip --type zip  
            - name: Smoke test (test)                                    
              run: |                                                   
                HOST=$(az webapp show --resource-group "$RESOURCE_GROUP" --name "app-devops-test-$NAME_SUFFIX" --query defaultHostName -o tsv)  
                echo "Checking https://$HOST/"                          
                curl --fail --silent --show-error --retry 6 --retry-delay 10 "https://$HOST/" | grep -i "hello devops"
      deploy-prod:                                                    
           name: Deploy to prod                                         
           needs: deploy-test                                             
           runs-on: ubuntu-latest                                     
           environment: prod                                           
           steps:                                                        
            - name: Download the website artifact                      
              uses: actions/download-artifact@v4                       
              with:                                                    
                name: website                                          
            - name: Log in to Azure (OIDC)                             
              uses: azure/login@v2                                     
              with:                                                     
                client-id: ${{ secrets.AZURE_CLIENT_ID }}               
                tenant-id: ${{ secrets.AZURE_TENANT_ID }}              
                subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}   
            - name: Zip deploy to the prod web app                       
              run: |                                                   
                az webapp deploy --resource-group "$RESOURCE_GROUP" --name "app-devops-prod-$NAME_SUFFIX" --src-path site.zip --type zip  
            - name: Smoke test (prod)                                    
              run: |                                                   
                HOST=$(az webapp show --resource-group "$RESOURCE_GROUP" --name "app-devops-prod-$NAME_SUFFIX" --query defaultHostName -o tsv)  
                echo "Checking https://$HOST/"                          
                curl --fail --silent --show-error --retry 6 --retry-delay 10 "https://$HOST/" | grep -i "hello devops" 