# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include:
      - main

pool:
  name: Default

steps:
  - bash: |
      echo "Validating site files..."                                   
      test -f site/index.html || (echo "Missing index.html" && exit 1)   
      test -f site/styles.css || (echo "Missing styles.css" && exit 1)  
      echo "All required files found."                                 
    displayName: 'Validate site files'

  - task: PublishBuildArtifacts@1              
    inputs:
      PathtoPublish: 'site'                 
      ArtifactName: 'website'                
    displayName: 'Publish website artifact'

  - stage: Provision                                           
  displayName: 'Provision Azure infrastructure'
  jobs:
    - job: TerraformApply
      pool:
        name: Default                                            
      steps:
        - task: AzureCLI@2                                       
          displayName: 'Terraform init, plan, apply'
          inputs:
            azureSubscription: 'azure-sub-connection'    
            scriptType: 'bash'                                    
            scriptLocation: 'inlineScript'                      
            inlineScript: |                                       
              cd infra
              terraform init                                      
              terraform plan -out=tfplan                          
              terraform apply -auto-approve tfplan