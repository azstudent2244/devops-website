trigger:
  branches:
    include:
      - main

variables:
  nameSuffix: 'jsm01' 

stages:
  - stage: CI
    displayName: 'Build and validate'
    jobs:
      - job: Validate
        pool:
          name: Default
        steps:
          - bash: |
              echo "Validating site files..."
              test -f site/index.html || (echo "Missing index.html" && exit 1)
              test -f site/styles.css || (echo "Missing styles.css" && exit 1)
              echo "All required files found."
            displayName: 'Validate site files'

          - task: ArchiveFiles@2                         
            displayName: 'Zip the website'
            inputs:
              rootFolderOrFile: '$(Build.SourcesDirectory)/site'
              includeRootFolder: false                   
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/site.zip'
              replaceExistingArchive: true

          - task: PublishPipelineArtifact@1             
            displayName: 'Publish website artifact'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/site.zip'
              artifact: 'website'

  - stage: Provision
    displayName: 'Provision Azure infrastructure'
    dependsOn: CI
    jobs:
      - job: TerraformApply
        pool:
          name: Default
        steps:
          - task: AzureCLI@2
            displayName: 'Terraform init, plan, apply'
            inputs:
              azureSubscription: 'azure-sub-connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                export TF_VAR_name_suffix=$(nameSuffix)
                cd infra
                terraform init
                terraform plan -out=tfplan
                terraform apply -auto-approve tfplan

  - stage: Dev  
    displayName: 'Deploy to dev'
    dependsOn: Provision
    jobs:
      - deployment: DeployDev  
        displayName: 'Deploy website to dev'
        pool:
          name: Default
        environment: 'dev'   
        strategy:
          runOnce:  
            deploy:   
              steps:
                - download: current   
                  artifact: website
                - task: AzureCLI@2
                  displayName: 'Zip deploy to dev web app'
                  inputs:
                    azureSubscription: 'azure-sub-connection'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    workingDirectory: '$(Pipeline.Workspace)/website'   
                    inlineScript: |
                      az webapp deploy --resource-group rg-devops-site --name app-devops-dev-$(nameSuffix) --src-path site.zip --type zip
                - task: AzureCLI@2
                  displayName: 'Smoke test (dev)'
                  inputs:
                    azureSubscription: 'azure-sub-connection'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      HOST=$(az webapp show --resource-group rg-devops-site --name app-devops-dev-$(nameSuffix) --query defaultHostName -o tsv | tr -d '\r')
                      echo "Checking https://$HOST/"
                      curl --fail --silent --show-error --retry 6 --retry-delay 10 "https://$HOST/" | grep -i "Hello, World!"

  - stage: Test
    displayName: 'Deploy to test'
    dependsOn: Dev
    jobs:
      - deployment: DeployTest
        displayName: 'Deploy website to test'
        pool:
          name: Default
        environment: 'test'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: website
                - task: AzureCLI@2
                  displayName: 'Zip deploy to test web app'
                  inputs:
                    azureSubscription: 'azure-sub-connection'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    workingDirectory: '$(Pipeline.Workspace)/website'
                    inlineScript: |
                      az webapp deploy --resource-group rg-devops-site --name app-devops-test-$(nameSuffix) --src-path site.zip --type zip
                - task: AzureCLI@2
                  displayName: 'Smoke test (test)'
                  inputs:
                    azureSubscription: 'azure-sub-connection'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      HOST=$(az webapp show --resource-group rg-devops-site --name app-devops-test-$(nameSuffix) --query defaultHostName -o tsv | tr -d '\r')
                      echo "Checking https://$HOST/"
                      curl --fail --silent --show-error --retry 6 --retry-delay 10 "https://$HOST/" | grep -i "Hello, World!"
  - stage: Prod
    displayName: 'Deploy to prod'
    dependsOn: Test
    jobs:
      - deployment: DeployProd
        displayName: 'Deploy website to prod'
        pool:
          name: Default
        environment: 'prod'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: website
                - task: AzureCLI@2
                  displayName: 'Zip deploy to prod web app'
                  inputs:
                    azureSubscription: 'azure-sub-connection'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    workingDirectory: '$(Pipeline.Workspace)/website'
                    inlineScript: |
                      az webapp deploy --resource-group rg-devops-site --name app-devops-prod-$(nameSuffix) --src-path site.zip --type zip
                - task: AzureCLI@2
                  displayName: 'Smoke test (prod)'
                  inputs:
                    azureSubscription: 'azure-sub-connection'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      HOST=$(az webapp show --resource-group rg-devops-site --name app-devops-prod-$(nameSuffix) --query defaultHostName -o tsv | tr -d '\r')
                      echo "Checking https://$HOST/"
                      curl --fail --silent --show-error --retry 6 --retry-delay 10 "https://$HOST/" | grep -i "Hello, World!"