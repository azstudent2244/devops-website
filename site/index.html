<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Test Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 16px;
      background: #f5f7fa;
      color: #222;
    }
    h1 { color: #0078d4; }
    button {
      background: #0078d4;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background: #005a9e; }
    #output { margin-top: 16px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Hello Devops!</h1>
  <p>This is a simple HTML test page.</p>

  <ul>
    <li>HTML structure</li>
    <li>CSS styling</li>
    <li>JavaScript interaction</li>
  </ul>

  <button id="btn">Click me</button>
  <p id="output"></p>

  <script>
    let count = 0;
    document.getElementById('btn').addEventListener('click', () => {
      count++;
      document.getElementById('output').textContent = 'Button clicked ' + count + ' time(s)!';
    });
  </script>
</body>
</html>
